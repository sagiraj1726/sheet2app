<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Sheet2App</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="site-nav"></header>
<main id="main">
  <section class="page-head" style="min-height:60vh;display:grid;align-content:center">
    <div class="wrap">
      <span class="kicker">Error 404</span>
      <h1 style="font-size:clamp(2rem,4vw,2.8rem)">We couldn't find that page</h1>
      <p class="lead" style="margin-inline:auto">The link may be old, or the workbook may have expired and been deleted automatically.</p>
      <div class="hero-actions" style="justify-content:center">
        <a class="btn btn-primary btn-lg" href="/">Go to the home page</a>
        <button class="btn btn-lg" data-act="demo">Try the demo</button>
      </div>
      <div class="dz-status" id="dz-status" role="status" aria-live="polite"></div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="/js/common.js"></script>
<script src="/js/notfound.js"></script>
</body>
</html>
